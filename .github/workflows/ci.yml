name: CI

# 四道独立 gate：任一失败，该 PR / master 推送即为红。
# 只读权限、不引用任何 secrets、不使用第三方 marketplace action（官方 actions/* 除外）。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: 语法门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译后端 *.py 与 tests/*.py
        shell: bash
        run: |
          shopt -s nullglob
          files=( *.py tests/*.py )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有 Python 文件，跳过语法检查。"
            exit 0
          fi
          python3 -m py_compile "${files[@]}"
          echo "语法检查通过：${#files[@]} 个文件。"

  regression:
    name: 回归门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 一键回归
        shell: bash
        run: bash tests/run_all.sh

  firewall:
    name: 内容防火墙门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 内容防火墙
        shell: bash
        run: bash tests/content_firewall.sh

  commit-email:
    name: 提交邮箱门
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史：PR 取 base..head，master 推送取 before..after，均为历史中的提交。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 提交邮箱门（铁律 3：作者邮箱一律 GitHub noreply）
        shell: bash
        env:
          # 事件 SHA 交给脚本自行挑用：PR 事件只有 BASE/HEAD，
          # push 事件只有 BEFORE/AFTER；都为空时脚本回退 origin/master..HEAD。
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: bash tests/commit_email_gate.sh
